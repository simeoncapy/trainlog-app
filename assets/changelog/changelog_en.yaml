changelog_en:
  - version: 0.5.0
    date: 2026-10-19
    changes:
      - type: feature
        text: "You can now edit your trips (everything except the path). Reminder: the app is still in beta, so export your trips before editing them, just in case."
      - type: fix
        text: Trips crossing the International Date Line now show their direction of travel correctly on the map.
  - version: 0.4.3
    date: 2026-10-10
    changes:
      - type: feature
        text: Search box on the map to find any place (cities, addresses, stations, airports, hotels, shops...) and move the map to it.
      - type: feature
        text: The pie is baked! The statistics pie chart now has distinct colours, numbered slices matching the legend, and the same units as the bar chart. Tap a slice or a legend entry to see its details.
      - type: minor
        text: Statistics can now show all vehicle types together, with bars coloured by vehicle type and a per-vehicle breakdown in the table.
      - type: minor
        text: Faster app startup, especially after the phone has been asleep for a long time.
      - type: minor
        text: When your session expires, your trips stay available and the app offers to log in again.
      - type: minor
        text: You can use your password manager to fill in the login form.
      - type: fix
        text: Refreshing the trips while offline now says so, and no longer causes updates made in the meantime to be missed once back online.
      - type: fix
        text: Users of an instance other than trainlog.me no longer have to log in again every time the app starts.
  - version: 0.4.2
    date: 2026-07-26
    changes:
      - type: feature
        text: New map setting to display chevrons on the trip paths showing the direction of travel.
      - type: fix
        text: Added map zoom limits to prevent a crash when zooming out quickly.
  - version: 0.4.1
    date: 2026-07-21
    changes:
      - type: feature
        text: Option to change the landing page in the settings.
      - type: feature
        text: Changelog feature to display the last change from the previous update.
      - type: fix
        text: Do not display 00 min on the trip card for trips without duration.
      - type: fix
        text: Status bar icons are now visible in light mode on the inbox and Trainlog status pages.
      - type: minor
        text: Statistics charts now show numbered rankings (1–10) instead of icons (0-9).
      - type: minor
        text: The timeline in the trip details sheet now shows a dashed line for future trips.

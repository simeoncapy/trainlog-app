changelog_fr:
  - version: 0.4.3
    date: 2026-10-10
    changes:
      - type: feature
        text: Barre de recherche sur la carte pour trouver n'importe quel lieu (villes, adresses, gares, aéroports, hôtels, commerces...) et y déplacer la carte.
      - type: feature
        text: Le camembert est affiné ! Le graphique en camembert des statistiques a désormais des couleurs distinctes, des parts numérotées correspondant à la légende et les mêmes unités que le graphique en barres. Touchez une part ou une entrée de la légende pour en voir le détail.
      - type: minor
        text: Les statistiques peuvent désormais regrouper tous les types de véhicule, avec des barres colorées par type de véhicule et le détail par véhicule dans le tableau.
  - version: 0.4.2
    date: 2026-07-26
    changes:
      - type: feature
        text: Nouveau paramètre de carte pour afficher des chevrons sur les trajets indiquant le sens du voyage.
      - type: fix
        text: Ajout de limites de zoom sur la carte pour éviter un plantage lors d'un zoom arrière rapide.
  - version: 0.4.1
    date: 2026-07-21
    changes:
      - type: feature
        text: Option pour changer la page d'accueil dans les paramètres.
      - type: feature
        text: Journal des modifications affichant les derniers changements après une mise à jour.
      - type: fix
        text: Ne pas afficher 00 min sur la carte du trajet pour les trajets sans durée.
      - type: fix
        text: Les icônes de la barre de notification sont désormais visibles en mode clair sur les pages boîte de réception et statut Trainlog.
      - type: minor
        text: Les statistiques affichent désormais un classement numéroté (1–10) au lieu des icônes (0-9).
      - type: minor
        text: La frise dans la fiche de détails du trajet affiche désormais une ligne en pointillés pour les trajets futurs.

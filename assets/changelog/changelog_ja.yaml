changelog_ja:
  - version: 0.4.3
    date: 2026-10-10
    changes:
      - type: feature
        text: 地図に検索ボックスを追加。都市、住所、駅、空港、ホテル、店舗などあらゆる場所を検索し、地図をその場所へ移動できます。
      - type: feature
        text: 統計の円グラフを改良。色が重複しない配色、凡例と対応する番号付きの扇形、棒グラフと同じ単位表示に対応しました。扇形または凡例をタップすると詳細を表示します。
      - type: minor
        text: 統計で全ての交通手段をまとめて表示できるようになりました。棒グラフは交通手段ごとに色分けされ、表には交通手段ごとの内訳が表示されます。
      - type: minor
        text: アプリの起動を高速化しました。特に端末が長時間スリープしていた後の起動が速くなります。
      - type: minor
        text: セッションの有効期限が切れても旅程はそのまま表示され、再ログインを促すようになりました。
      - type: minor
        text: パスワードマネージャーを使ってログインフォームに入力できるようになりました。
      - type: fix
        text: オフラインで旅程を更新した場合はその旨を表示し、接続回復後にその間の更新が取り込まれない問題を修正しました。
      - type: fix
        text: trainlog.me 以外のインスタンスを使用している場合に、アプリを起動するたびに再ログインが必要になる問題を修正しました。
  - version: 0.4.2
    date: 2026-07-26
    changes:
      - type: feature
        text: 地図上の移動経路に進行方向を示すシェブロン（山形マーク）を表示する設定を追加。
      - type: fix
        text: 地図のズームに上限と下限を設定し、素早く縮小した際のクラッシュを修正。
  - version: 0.4.1
    date: 2026-07-21
    changes:
      - type: feature
        text: 設定で起動時に表示するページを変更できるオプションを追加。
      - type: feature
        text: アップデート後に前回からの変更点を表示する変更履歴機能を追加。
      - type: fix
        text: 所要時間がない経路の経路カードに00分と表示されないように修正。
      - type: fix
        text: 受信箱およびTrainlogステータスページのステータスバーアイコンがライトモードで表示されるように修正。
      - type: minor
        text: 統計グラフでアイコン（0〜9）の代わりに順位番号（1〜10）を表示するようになりました。
      - type: minor
        text: 経路詳細シートのタイムラインで、未来の経路が破線で表示されるようになりました。

changelog_tl:
  - version: 0.4.3
    date: 2026-10-10
    changes:
      - type: feature
        text: Search box sa mapa para mahanap ang anumang lugar (lungsod, address, istasyon, paliparan, hotel, tindahan...) at ilipat ang mapa doon.
      - type: feature
        text: Pinahusay ang pie chart ng statistics na may magkakaibang kulay, may-numerong bahagi na tugma sa legend, at parehong mga unit tulad ng bar chart. I-tap ang isang bahagi o item sa legend para makita ang mga detalye.
      - type: minor
        text: Maaari nang ipakita ng statistics ang lahat ng uri ng sasakyan nang sabay, na may mga bar na may kulay ayon sa uri ng sasakyan at breakdown bawat sasakyan sa table.
      - type: minor
        text: Mas mabilis na pagbukas ng app, lalo na kapag matagal na naka-sleep ang phone.
      - type: minor
        text: Kapag nag-expire ang session mo, makikita pa rin ang mga biyahe mo at aalukin kang mag-login ulit.
      - type: fix
        text: Kapag nag-refresh ng mga biyahe nang offline, sinasabi na ito ng app, at hindi na nalalaktawan ang mga update sa pagitan kapag bumalik ang koneksyon.
      - type: fix
        text: Hindi na kailangang mag-login ulit tuwing bubuksan ang app ng mga gumagamit ng instance maliban sa trainlog.me.
  - version: 0.4.2
    date: 2026-07-26
    changes:
      - type: feature
        text: Bagong setting ng mapa para magpakita ng mga chevron sa mga ruta ng biyahe na nagpapakita ng direksyon ng paglalakbay.
      - type: fix
        text: Nagdagdag ng limitasyon sa zoom ng mapa para maiwasan ang pag-crash kapag mabilis ang pag-zoom out.
  - version: 0.4.1
    date: 2026-07-21
    changes:
      - type: feature
        text: Opsyon para palitan ang landing page sa mga setting.
      - type: feature
        text: Changelog feature para ipakita ang mga pagbabago mula sa nakaraang update.
      - type: fix
        text: Huwag ipakita ang 00 min sa trip card para sa mga biyahe na walang duration.
      - type: fix
        text: Nakikita na ang mga icon ng status bar sa light mode sa mga pahina ng inbox at Trainlog status.
      - type: minor
        text: Ang mga statistics chart ay nagpapakita na ng may-numerong ranggo (1–10) sa halip na icons (0-9).
      - type: minor
        text: Ang timeline sa detail sheet ng biyahe ay nagpapakita na ng dashed na linya para sa mga biyahe sa hinaharap.
